project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - projects.qmd
    - publications.qmd
    - cv.qmd
  resources:
    - img/**
    - files/**

website:
  title: "Richard Höchter"
  site-url: "https://richard-hoechter.github.io"
  description: "Student der Sozialwissenschaften: Projekte und CV."
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projekte
      - href: cv.qmd
        text: CV
    right:
      - icon: github
        href: https://github.com/Richard-Hoechter
        target: _blank
        rel: noopener noreferrer
      - icon: linkedin
        href: https://www.linkedin.com/in/richard-hoechter
        target: _blank
        rel: noopener noreferrer
  page-footer:
    left: "© 2025 Richard Höchter"
    right: "Built with Quarto"
  search: false
format:
  html:
    theme: flatly
    css: styles.css
    toc: false
    smooth-scroll: true